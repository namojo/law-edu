<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="판례·계약서 병렬 분석과 승인 관문">
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
  </defs>
  <rect width="840" height="320" fill="#f5f0e6"/>
  <text x="24" y="34" font-family="ui-monospace,monospace" font-size="11" letter-spacing="3" fill="#78716c">PARALLEL ANALYSIS</text>
  <text x="24" y="56" font-size="17" font-weight="700" fill="#1c1917">병렬 분석: 빨리 만드는 일과 책임 있게 내보내는 일을 나눈다</text>

  <!-- 문서 묶음 -->
  <g stroke="#1c1917" stroke-width="1.5" fill="#ffffff">
    <rect x="40" y="132" width="96" height="66"/>
    <rect x="34" y="126" width="96" height="66"/>
    <rect x="28" y="120" width="96" height="66"/>
  </g>
  <text x="76" y="148" font-size="12" font-weight="600" fill="#1c1917" text-anchor="middle">비식별 샘플</text>
  <text x="76" y="166" font-size="11" fill="#57534e" text-anchor="middle">문서 20건</text>

  <!-- 팬아웃: 에이전트 -->
  <g stroke="#1c1917" stroke-width="1.5" fill="#ffffff">
    <rect x="220" y="84" width="150" height="48"/>
    <rect x="220" y="146" width="150" height="48"/>
    <rect x="220" y="208" width="150" height="48"/>
  </g>
  <g font-size="12" font-weight="600" fill="#1c1917" text-anchor="middle">
    <text x="295" y="112">분석 에이전트 A</text>
    <text x="295" y="174">분석 에이전트 B</text>
    <text x="295" y="236">분석 에이전트 C</text>
  </g>
  <g stroke="#1c1917" stroke-width="1.5" fill="none">
    <line x1="136" y1="140" x2="218" y2="108" marker-end="url(#arrow5)"/>
    <line x1="136" y1="158" x2="218" y2="170" marker-end="url(#arrow5)"/>
    <line x1="136" y1="176" x2="218" y2="232" marker-end="url(#arrow5)"/>
  </g>
  <text x="168" y="86" font-size="11" fill="#57534e">동시에 나눠 분석</text>

  <!-- 결과 표 -->
  <rect x="420" y="132" width="140" height="66" stroke="#1c1917" stroke-width="1.5" fill="#ffffff"/>
  <line x1="420" y1="154" x2="560" y2="154" stroke="#1c1917" stroke-width="1"/>
  <line x1="466" y1="132" x2="466" y2="198" stroke="#a8a29e" stroke-width="0.8"/>
  <line x1="513" y1="132" x2="513" y2="198" stroke="#a8a29e" stroke-width="0.8"/>
  <text x="490" y="149" font-size="11.5" font-weight="600" fill="#1c1917" text-anchor="middle">결과 표</text>
  <text x="490" y="178" font-size="10.5" fill="#57534e" text-anchor="middle">조항 유무·차이</text>
  <g stroke="#1c1917" stroke-width="1.5" fill="none">
    <line x1="370" y1="108" x2="418" y2="146" marker-end="url(#arrow5)"/>
    <line x1="370" y1="170" x2="418" y2="166" marker-end="url(#arrow5)"/>
    <line x1="370" y1="232" x2="418" y2="186" marker-end="url(#arrow5)"/>
  </g>

  <!-- 레드라인 → 승인 관문 → 발송 -->
  <rect x="596" y="132" width="90" height="66" stroke="#1c1917" stroke-width="1.5" fill="#ffffff"/>
  <text x="641" y="160" font-size="12" font-weight="600" fill="#1c1917" text-anchor="middle">레드라인</text>
  <text x="641" y="180" font-size="10.5" fill="#57534e" text-anchor="middle">검토 흔적</text>
  <line x1="560" y1="165" x2="594" y2="165" stroke="#1c1917" stroke-width="1.5" marker-end="url(#arrow5)"/>

  <!-- gate -->
  <g stroke="#b45309" stroke-width="2.5">
    <line x1="712" y1="126" x2="712" y2="204"/>
    <line x1="720" y1="126" x2="720" y2="204"/>
  </g>
  <text x="716" y="118" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">승인 관문</text>
  <text x="716" y="222" font-size="10.5" fill="#b45309" text-anchor="middle">사람 승인</text>
  <line x1="686" y1="165" x2="708" y2="165" stroke="#1c1917" stroke-width="1.5" marker-end="url(#arrow5)"/>

  <rect x="742" y="132" width="74" height="66" stroke="#1c1917" stroke-width="1.5" fill="#ffffff"/>
  <text x="779" y="160" font-size="12" font-weight="600" fill="#1c1917" text-anchor="middle">발송·보관</text>
  <text x="779" y="180" font-size="10.5" fill="#57534e" text-anchor="middle">버전 기록</text>
  <line x1="724" y1="165" x2="740" y2="165" stroke="#1c1917" stroke-width="1.5" marker-end="url(#arrow5)"/>

  <text x="24" y="292" font-size="11" fill="#57534e">제어 규칙: 금액·당사자·책임 조항은 자동 수정 금지 · 자동 생성 문서는 초안 표시 유지 · 외부 발송은 항상 사람 승인</text>
</svg>
