<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="나쁜 지시와 좋은 지시 비교">
  <rect width="840" height="300" fill="#f5f0e6"/>
  <text x="24" y="34" font-family="ui-monospace,monospace" font-size="11" letter-spacing="3" fill="#78716c">BEFORE / AFTER</text>
  <text x="24" y="56" font-size="17" font-weight="700" fill="#1c1917">같은 요청, 다른 결과: 빈칸을 사람이 채우면 추측이 사라진다</text>

  <rect x="24" y="84" width="380" height="192" fill="#ffffff" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="44" y="114" font-size="13" font-weight="700" fill="#78716c">나쁜 지시</text>
  <text x="44" y="146" font-size="13" fill="#1c1917">"이 계약서 검토해줘."</text>
  <g font-size="11" fill="#57534e">
    <text x="44" y="182">목적 없음 → AI가 추측</text>
    <text x="44" y="206">자료 범위 없음 → 아무거나 근거로 씀</text>
    <text x="44" y="230">형식 없음 → 결과마다 모양이 다름</text>
    <text x="44" y="254">검토 기준 없음 → 틀려도 그럴듯해 보임</text>
  </g>

  <rect x="436" y="84" width="380" height="192" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="456" y="114" font-size="13" font-weight="700" fill="#b45309">좋은 지시 (6요소)</text>
  <g font-size="11" fill="#1c1917">
    <text x="456" y="146">목적: 임차인 입장 위험 조항 내부 검토</text>
    <text x="456" y="170">자료: 첨부한 비식별 계약서 초안 1건만</text>
    <text x="456" y="194">금지: 자료에 없는 사실 추정 금지</text>
    <text x="456" y="218">형식: 조항·요약·위험·확인 질문 4열 표</text>
    <text x="456" y="242">기준: 모든 행을 실제 조항과 대조</text>
    <text x="456" y="266">예시: 비식별 샘플 1건 첨부</text>
  </g>
</svg>
