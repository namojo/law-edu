<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="법률업무 지시서 6요소">
  <rect width="840" height="320" fill="#f5f0e6"/>
  <text x="24" y="34" font-family="ui-monospace,monospace" font-size="11" letter-spacing="3" fill="#78716c">INSTRUCTION SHEET</text>
  <text x="24" y="56" font-size="17" font-weight="700" fill="#1c1917">법률업무 지시서 6요소: 하나라도 빠지면 AI는 추측한다</text>

  <g stroke="#1c1917" stroke-width="1.5" fill="#ffffff">
    <rect x="24" y="84" width="256" height="92"/>
    <rect x="292" y="84" width="256" height="92"/>
    <rect x="560" y="84" width="256" height="92"/>
    <rect x="24" y="196" width="256" height="92"/>
    <rect x="292" y="196" width="256" height="92"/>
    <rect x="560" y="196" width="256" height="92"/>
  </g>
  <g fill="#b45309" font-family="ui-monospace,monospace" font-size="13" font-weight="700">
    <text x="44" y="112">1</text>
    <text x="312" y="112">2</text>
    <text x="580" y="112">3</text>
    <text x="44" y="224">4</text>
    <text x="312" y="224">5</text>
    <text x="580" y="224">6</text>
  </g>
  <g font-size="14" font-weight="600" fill="#1c1917">
    <text x="64" y="112">목적·독자</text>
    <text x="332" y="112">제공 자료</text>
    <text x="600" y="112">금지사항</text>
    <text x="64" y="224">결과 형식</text>
    <text x="332" y="224">검토 기준</text>
    <text x="600" y="224">비식별 예시</text>
  </g>
  <g font-size="11" fill="#57534e">
    <text x="44" y="138">이 문서를 누가, 왜 읽는가</text>
    <text x="44" y="158">쓰임새가 형식을 정한다</text>
    <text x="312" y="138">참고할 자료의 범위</text>
    <text x="312" y="158">자료 밖 추측 금지</text>
    <text x="580" y="138">하지 말아야 할 일</text>
    <text x="580" y="158">근거 없는 단정 금지 등</text>
    <text x="44" y="250">항목·순서·표 구조</text>
    <text x="44" y="270">받을 모양을 미리 정한다</text>
    <text x="312" y="250">무엇을 확인하면 합격인가</text>
    <text x="312" y="270">검토가 계획에 들어간다</text>
    <text x="580" y="250">원하는 결과의 견본 1건</text>
    <text x="580" y="270">개인정보 없는 샘플만</text>
  </g>
</svg>
