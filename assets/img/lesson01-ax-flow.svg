<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="AX 기본 구조 흐름도">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="840" height="320" fill="#f5f0e6"/>
  <text x="24" y="34" font-family="ui-monospace,monospace" font-size="11" letter-spacing="3" fill="#78716c">AX BASIC STRUCTURE</text>
  <text x="24" y="56" font-size="17" font-weight="700" fill="#1c1917">AX 기본 구조: 초안은 승인을 지나야 업무가 된다</text>

  <!-- Row 1 -->
  <g stroke="#1c1917" stroke-width="1.5" fill="#ffffff">
    <rect x="24" y="90" width="150" height="64" />
    <rect x="234" y="90" width="150" height="64" />
    <rect x="444" y="90" width="150" height="64" />
  </g>
  <text x="99" y="117" font-size="14" font-weight="600" fill="#1c1917" text-anchor="middle">업무 목표</text>
  <text x="99" y="137" font-size="11" fill="#57534e" text-anchor="middle">무엇을 위해 하는가</text>
  <text x="309" y="117" font-size="14" font-weight="600" fill="#1c1917" text-anchor="middle">허용된 입력자료</text>
  <text x="309" y="137" font-size="11" fill="#57534e" text-anchor="middle">비식별·공개 자료만</text>
  <text x="519" y="117" font-size="14" font-weight="600" fill="#1c1917" text-anchor="middle">AI 정리·분석·초안</text>
  <text x="519" y="137" font-size="11" fill="#57534e" text-anchor="middle">결과는 아직 초안</text>

  <line x1="174" y1="122" x2="232" y2="122" stroke="#1c1917" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="384" y1="122" x2="442" y2="122" stroke="#1c1917" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <g stroke="#1c1917" stroke-width="1.5" fill="#ffffff">
    <rect x="444" y="210" width="150" height="64" />
    <rect x="234" y="210" width="150" height="64" />
    <rect x="24" y="210" width="150" height="64" />
  </g>
  <text x="519" y="237" font-size="14" font-weight="600" fill="#1c1917" text-anchor="middle">출처·사실·누락 검증</text>
  <text x="519" y="257" font-size="11" fill="#57534e" text-anchor="middle">원문과 대조한다</text>
  <text x="309" y="237" font-size="14" font-weight="600" fill="#b45309" text-anchor="middle">변호사 승인 / 반려</text>
  <text x="309" y="257" font-size="11" fill="#57534e" text-anchor="middle">결정은 사람이 한다</text>
  <text x="99" y="237" font-size="14" font-weight="600" fill="#1c1917" text-anchor="middle">최종 사용·작업 기록</text>
  <text x="99" y="257" font-size="11" fill="#57534e" text-anchor="middle">누가 승인했는지 남긴다</text>

  <line x1="519" y1="154" x2="519" y2="208" stroke="#1c1917" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="444" y1="242" x2="386" y2="242" stroke="#1c1917" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="234" y1="242" x2="176" y2="242" stroke="#1c1917" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 반려 loop -->
  <path d="M 309 210 L 309 178 L 594 178 L 594 154" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
  <text x="452" y="172" font-size="11" fill="#b45309" text-anchor="middle">반려 시 다시 작성</text>

  <rect x="640" y="90" width="176" height="184" fill="none" stroke="#a8a29e" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="728" y="118" font-size="12" font-weight="600" fill="#57534e" text-anchor="middle">기억할 것</text>
  <text x="728" y="146" font-size="11" fill="#57534e" text-anchor="middle">· AI 결과는 검토할 재료</text>
  <text x="728" y="170" font-size="11" fill="#57534e" text-anchor="middle">· 확인이 끝난 결론 아님</text>
  <text x="728" y="194" font-size="11" fill="#57534e" text-anchor="middle">· 승인 없이 발송 없음</text>
  <text x="728" y="218" font-size="11" fill="#57534e" text-anchor="middle">· 기록이 책임을 지킨다</text>
</svg>
