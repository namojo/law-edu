<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="설치 순서 4단계 타임라인">
  <defs>
