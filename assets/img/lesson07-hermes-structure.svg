<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="헤르메스식 운영 구조도">
  <defs>
    <marker id="arrow7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="arrow7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="840" height="360" fill="#f5f0e6"/>
  <text x="24" y="34" font-family="ui-monospace,monospace" font-size="11" letter-spacing="3" fill="#78716c">HERMES STRUCTURE</text>
  <text x="24" y="56" font-size="17" font-weight="700" fill="#1c1917">헤르메스식 운영 구조: 나눠 보내고, 모아 오고, 사람이 승인한다</text>

  <!-- 요청 -->
  <rect x="24" y="150" width="110" height="56" stroke="#1c1917" stroke-width="1.5" fill="#ffffff"/>
  <text x="79" y="174" font-size="13" font-weight="600" fill="#1c1917" text-anchor="middle">요청</text>
  <text x="79" y="192" font-size="10.5" fill="#57534e" text-anchor="middle">할 일이 들어옴</text>

  <!-- 헤르메스 -->
  <rect x="180" y="136" width="160" height="84" stroke="#1c1917" stroke-width="2" fill="#ffffff"/>
  <text x="260" y="164" font-size="14" font-weight="700" fill="#1c1917" text-anchor="middle">헤르메스</text>
  <text x="260" y="184" font-size="10.5" fill="#57534e" text-anchor="middle">요청 분배 · 결과 수합</text>
  <text x="260" y="202" font-size="10.5" fill="#57534e" text-anchor="middle">판단·승인 안 함</text>
  <line x1="134" y1="178" x2="178" y2="178" stroke="#1c1917" stroke-width="1.5" marker-end="url(#arrow7)"/>

  <!-- 역할 에이전트 -->
  <g stroke="#1c1917" stroke-width="1.5" fill="#ffffff">
    <rect x="404" y="84" width="176" height="56"/>
    <rect x="404" y="150" width="176" height="56"/>
    <rect x="404" y="216" width="176" height="56"/>
  </g>
  <g font-size="12.5" font-weight="600" fill="#1c1917">
    <text x="418" y="108">운영관리 에이전트</text>
    <text x="418" y="174">재무관리 에이전트</text>
    <text x="418" y="240">홍보·모니터링 에이전트</text>
  </g>
  <g font-size="10" fill="#57534e">
    <text x="418" y="126">스킬: 견적서 생성 · 지출결의 초안</text>
    <text x="418" y="192">스킬: 비용 검토 · 보고 초안</text>
    <text x="418" y="258">스킬: 모니터링 기록 · 미디어킷</text>
  </g>
  <g stroke="#1c1917" stroke-width="1.5" fill="none">
    <line x1="340" y1="158" x2="402" y2="116" marker-end="url(#arrow7)"/>
    <line x1="340" y1="178" x2="402" y2="178" marker-end="url(#arrow7)"/>
    <line x1="340" y1="198" x2="402" y2="240" marker-end="url(#arrow7)"/>
  </g>
  <text x="370" y="86" font-size="10.5" fill="#57534e" text-anchor="middle">알맞은 곳에 분배</text>

  <!-- 기록표 -->
  <rect x="404" y="296" width="176" height="34" stroke="#a8a29e" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
  <text x="492" y="317" font-size="11" fill="#57534e" text-anchor="middle">기록표: 상태·번호·승인자 갱신</text>
  <g stroke="#a8a29e" stroke-width="1" stroke-dasharray="3 3">
    <line x1="470" y1="272" x2="480" y2="294"/>
  </g>

  <!-- 수합/보고 -->
  <rect x="628" y="150" width="88" height="56" stroke="#1c1917" stroke-width="1.5" fill="#ffffff"/>
  <text x="672" y="174" font-size="12.5" font-weight="600" fill="#1c1917" text-anchor="middle">결과 수합</text>
  <text x="672" y="192" font-size="10.5" fill="#57534e" text-anchor="middle">검수 기준 확인</text>
  <g stroke="#1c1917" stroke-width="1.5" fill="none">
    <line x1="580" y1="112" x2="626" y2="160" marker-end="url(#arrow7)"/>
    <line x1="580" y1="178" x2="626" y2="178" marker-end="url(#arrow7)"/>
    <line x1="580" y1="244" x2="626" y2="196" marker-end="url(#arrow7)"/>
  </g>

  <!-- 사람 승인 -->
  <rect x="740" y="144" width="76" height="68" fill="#b45309"/>
  <text x="778" y="172" font-size="13" font-weight="700" fill="#f5f0e6" text-anchor="middle">사람</text>
  <text x="778" y="192" font-size="11" fill="#f5f0e6" text-anchor="middle">최종 승인</text>
  <line x1="716" y1="178" x2="738" y2="178" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow7a)"/>

  <text x="24" y="292" font-size="11" fill="#57534e">여러분의 30일 파일럿도 같은 뼈대를 씁니다:</text>
  <text x="24" y="312" font-size="11" fill="#57534e">역할 카드 → 스킬 → 기록표 → 검수 기준 → 사람 승인 · 최소 권한과 중지 장치를 함께 정합니다</text>
</svg>
