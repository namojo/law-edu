<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="에이전트 도구 3종 역할 지도">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
  </defs>
  <rect width="840" height="340" fill="#f5f0e6"/>
  <text x="24" y="34" font-family="ui-monospace,monospace" font-size="11" letter-spacing="3" fill="#78716c">TOOLKIT MAP</text>
  <text x="24" y="56" font-size="17" font-weight="700" fill="#1c1917">오늘 설치하는 세 도구: 역할이 다르다</text>

  <!-- 사용자 -->
  <rect x="345" y="78" width="150" height="46" fill="#1c1917"/>
  <text x="420" y="106" font-size="14" font-weight="700" fill="#f5f0e6" text-anchor="middle">변호사 (나)</text>

  <line x1="380" y1="124" x2="164" y2="168" stroke="#1c1917" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="420" y1="124" x2="420" y2="168" stroke="#1c1917" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="460" y1="124" x2="676" y2="168" stroke="#1c1917" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- 도구 3종 -->
  <g stroke="#1c1917" stroke-width="1.5" fill="#ffffff">
    <rect x="40" y="170" width="240" height="88"/>
    <rect x="300" y="170" width="240" height="88"/>
    <rect x="560" y="170" width="240" height="88"/>
  </g>
  <text x="160" y="196" font-size="14" font-weight="700" fill="#1c1917" text-anchor="middle">안티그래비티</text>
  <text x="160" y="216" font-size="11" fill="#57534e" text-anchor="middle">문서 작업 환경</text>
  <text x="160" y="236" font-size="11" fill="#57534e" text-anchor="middle">파일·브라우저·터미널을 다룸</text>

  <text x="420" y="196" font-size="14" font-weight="700" fill="#1c1917" text-anchor="middle">헤르메스 에이전트</text>
  <text x="420" y="216" font-size="11" fill="#57534e" text-anchor="middle">일 분배·결과 수합</text>
  <text x="420" y="236" font-size="11" fill="#57534e" text-anchor="middle">판단·승인은 하지 않음</text>

  <text x="680" y="196" font-size="14" font-weight="700" fill="#1c1917" text-anchor="middle">파이 (Pi)</text>
  <text x="680" y="216" font-size="11" fill="#57534e" text-anchor="middle">터미널 실행 도구</text>
  <text x="680" y="236" font-size="11" fill="#57534e" text-anchor="middle">리서치 스킬을 붙여 사용</text>

  <!-- 연동 -->
  <g stroke="#b45309" stroke-width="1.2" stroke-dasharray="5 4" fill="none">
    <line x1="160" y1="258" x2="160" y2="292"/>
    <line x1="420" y1="258" x2="420" y2="292"/>
    <line x1="680" y1="258" x2="680" y2="292"/>
  </g>
  <g font-size="11" fill="#b45309" text-anchor="middle">
    <text x="160" y="310">구글 계정 연동 (권한 범위 확인)</text>
    <text x="420" y="310">시스템·메신저 연동 (알림 범위 제한)</text>
    <text x="680" y="310">AI 모델 연결 (API 키 보관 규칙)</text>
  </g>
</svg>
