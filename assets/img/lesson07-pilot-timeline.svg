<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="30일 파일럿 주차별 타임라인">
  <rect width="840" height="240" fill="#f5f0e6"/>
  <text x="24" y="34" font-family="ui-monospace,monospace" font-size="11" letter-spacing="3" fill="#78716c">30-DAY PILOT</text>
  <text x="24" y="56" font-size="17" font-weight="700" fill="#1c1917">30일 파일럿: 확대는 측정 결과가 결정한다</text>

  <line x1="60" y1="128" x2="800" y2="128" stroke="#a8a29e" stroke-width="1.2"/>
  <g fill="#1c1917">
    <circle cx="120" cy="128" r="7"/>
    <circle cx="300" cy="128" r="7"/>
    <circle cx="480" cy="128" r="7"/>
    <circle cx="660" cy="128" r="7"/>
  </g>
  <circle cx="790" cy="128" r="9" fill="#b45309"/>
  <g font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="#78716c" text-anchor="middle">
    <text x="120" y="100">1주차</text>
    <text x="300" y="100">2주차</text>
    <text x="480" y="100">3주차</text>
    <text x="660" y="100">4주차</text>
    <text x="790" y="100">30일</text>
  </g>
  <g font-size="13" font-weight="600" fill="#1c1917" text-anchor="middle">
    <text x="120" y="160">세팅</text>
    <text x="300" y="160">운영</text>
    <text x="480" y="160">주간 점검</text>
    <text x="660" y="160">측정 정리</text>
    <text x="790" y="160" fill="#b45309">판단</text>
  </g>
  <g font-size="10.5" fill="#57534e" text-anchor="middle">
    <text x="120" y="182">역할·스킬·기록표</text>
    <text x="300" y="182">비식별 자료 범위에서</text>
    <text x="480" y="182">성공 기준과 대조</text>
    <text x="660" y="182">중단 조건 확인</text>
    <text x="790" y="182">확대 / 중단</text>
  </g>
  <text x="24" y="222" font-size="11" fill="#57534e">중단 조건에 걸리면 언제든 멈춥니다. 멈춘 기록도 파일럿의 결과입니다.</text>
</svg>
